name: MugoatReborn
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: vn.mugoat.reborn.diagnostics
    CODE_SIGNING_ALLOWED: NO
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "ZSTD_DISABLE_ASM"]
    SWIFT_OBJC_BRIDGING_HEADER: Runtime/RuntimeBridge.h
targets:
  MugoatReborn:
    type: application
    platform: iOS
    sources:
      - Launcher
      - Runtime
      - path: Vendor/zstd/lib
        excludes: ["**/*.S"]
    dependencies:
      - sdk: libz.tbd
    resources:
      - path: Vendor/zstd/LICENSE
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: Mugoat Reborn Audit
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
schemes:
  MugoatReborn:
    build:
      targets:
        MugoatReborn: all
