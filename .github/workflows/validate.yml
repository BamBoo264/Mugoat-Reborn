name: Validate Reborn import architecture
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reborn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  import-diagnostics:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: Manifest validation tests
        run: |
          swiftc ios/Launcher/ImportManifest.swift tests/manifest_tests.swift -o "$RUNNER_TEMP/manifest-tests"
          "$RUNNER_TEMP/manifest-tests"
      - name: Production managed importer roundtrip
        run: |
          swiftc ios/Launcher/ImportManifest.swift ios/Launcher/DataImportManager.swift tests/import_roundtrip.swift -o "$RUNNER_TEMP/import-tests"
          "$RUNNER_TEMP/import-tests"
      - name: Original native archive runtime tests
        run: |
          python3 tests/rpf_fixture.py "$RUNNER_TEMP/rpf-fixtures"
          python3 tools/build_runtime_testlib.py "$RUNNER_TEMP/runtime-asan" --sanitize
          swiftc -sanitize=address -import-objc-header ios/Runtime/RuntimeBridge.h ios/Runtime/RPF7Archive.swift ios/Runtime/ResourceMemory.swift tests/rpf_native.swift "$RUNNER_TEMP/runtime-asan/runtime.a" -lz -o "$RUNNER_TEMP/rpf-native"
          "$RUNNER_TEMP/rpf-native" "$RUNNER_TEMP/rpf-fixtures"
      - name: Production asynchronous asset scheduler
        run: |
          python3 tools/build_runtime_testlib.py "$RUNNER_TEMP/runtime-plain"
          swiftc -import-objc-header ios/Runtime/RuntimeBridge.h ios/Runtime/RPF7Archive.swift ios/Runtime/ResourceMemory.swift ios/Runtime/NativeAssetStore.swift tests/asset_store.swift "$RUNNER_TEMP/runtime-plain/runtime.a" -lz -o "$RUNNER_TEMP/asset-store"
          "$RUNNER_TEMP/asset-store" "$RUNNER_TEMP/rpf-fixtures"
      - name: Production RSC7 resource and virtual segment decoder
        run: |
          swiftc -sanitize=address -import-objc-header ios/Runtime/RuntimeBridge.h ios/Runtime/RPF7Archive.swift ios/Runtime/ResourceMemory.swift tests/resource_native.swift "$RUNNER_TEMP/runtime-asan/runtime.a" -lz -o "$RUNNER_TEMP/resource-native"
          "$RUNNER_TEMP/resource-native"
      - name: Native runtime bootstrap metadata
        run: |
          swiftc -import-objc-header ios/Runtime/RuntimeBridge.h ios/Runtime/RPF7Archive.swift ios/Runtime/ResourceMemory.swift ios/Runtime/NativeAssetStore.swift ios/Runtime/RuntimeBootstrap.swift tests/bootstrap_native.swift "$RUNNER_TEMP/runtime-plain/runtime.a" -lz -o "$RUNNER_TEMP/bootstrap"
          "$RUNNER_TEMP/bootstrap"
      - name: iPhone SDK type check
        run: xcrun swiftc -typecheck -parse-as-library -target arm64-apple-ios16.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -import-objc-header ios/Runtime/RuntimeBridge.h ios/Launcher/*.swift ios/Runtime/*.swift
      - run: command -v xcodegen || brew install xcodegen
      - name: Build diagnostic import app; game runtime is NOT COMPLETED
        run: bash tools/build_diagnostics.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Reborn-IMPORT-DIAGNOSTICS-NOT-GAME
          path: Mugoat-Reborn-Diagnostics-UNSIGNED.ipa
          retention-days: 7
