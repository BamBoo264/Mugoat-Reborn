name: Build native launcher Vietnamese bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reborn-native-bridge
  cancel-in-progress: false
jobs:
  bridge:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test composer and localization
        run: python3 -m unittest discover -s tests -p 'test_native_*.py' -v
      - name: Compile minimal ARM64 language bootstrap
        run: |
          set -eu
          mkdir -p build/bridge
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.3 -isysroot "$SDK" -fobjc-arc -fmodules -O2 -dynamiclib ios/NativeBridge/Entry.m -framework Foundation -install_name @rpath/libRebornBridge.dylib -o build/bridge/libRebornBridge.dylib
          cp ios/NativeBridge/launcher_vi.json build/bridge/launcher_vi.json
          xcrun vtool -show-build build/bridge/libRebornBridge.dylib
          shasum -a 256 build/bridge/libRebornBridge.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: Reborn-native-language-SOURCE-ONLY-NOT-IPA
          path: |
            build/bridge/libRebornBridge.dylib
            build/bridge/launcher_vi.json
